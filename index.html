<title>Página em construção</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
.hidden { display: none !important; }
#login.obras { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; position: relative;
  background: #f6f4ef; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.ob { text-align: center; max-width: 340px; width: 100%; }
.ob h1 { font-size: 22px; font-weight: 600; color: #3a3540; margin: 10px 0 8px; }
.ob p { color: #6e6876; font-size: 15.5px; line-height: 1.55; margin: 0; }
.ob-form { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.ob-form input { width: 100%; padding: 11px 13px; border: 1px solid #ddd8cf; border-radius: 10px; background: #fff; font-size: 16px; color: #2b2730; font-family: inherit; }
.ob-form input:focus { border-color: #8a8294; outline: 2px solid #e6e1ea; }
.ob-form button { padding: 12px; border: 0; border-radius: 10px; background: #4a4452; color: #fff; font-size: 15.5px; font-weight: 600; font-family: inherit; cursor: pointer; }
.ob-form button:disabled { opacity: .6; }
.ob-msg { font-size: 13.5px; color: #8c2318; background: #fdecea; border-radius: 8px; padding: 8px 10px; }
.ob-rod { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: #a8a2ae; font-size: 12.5px; }
#obSinal { display: inline-block; padding: 8px 14px; cursor: default; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
