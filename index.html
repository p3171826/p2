  });
}
async function registarVistos(lista) {
  const rows = lista.map(av => ({ atividade_id: av.a.id, tipo: av.tipo, data_fim_ref: av.a.data_fim_prevista, user_id: S.perfil.user_id, email: S.perfil.email }));
  const { data, error } = await sb.from('avisos_vistos').insert(rows).select();
  if (error && !/duplicate key/i.test(error.message || '')) throw error;
  if (data) S.avisosVistos.push(...data);
  else S.avisosVistos.push(...rows.map(r => Object.assign({ visto_em: new Date().toISOString() }, r)));
}
/* Mostra os avisos uma vez por abertura da aplicação */
function avisosAoAbrir() {
  if (S._avisosMostrados) return; S._avisosMostrados = true;
  const l = meusAvisosPorVer(); if (l.length) mostrarAvisos(l);
}

/* Painel do coordenador: quem viu o quê */
function cartaoAvisosCoord() {
  if (!eCoord() || !avisosAtivos()) return '';
  const todos = todosAvisos(); if (!todos.length) return `<section class="card" style="margin-bottom:16px"><div class="hd"><h2>Avisos aos colaboradores</h2></div><div class="bd"><div class="empty">Não há atividades a terminar nos próximos ${antecedencia()} dias nem com prazo terminado.</div></div></section>`;

  });

  return `<section class="card" style="margin-bottom:16px"><div class="hd"><h2>Avisos aos colaboradores</h2><span class="muted small">${nV} de ${linhas.length} vistos · antecedência ${antecedencia()} dias</span></div>
    <div class="bd"><div class="tblwrap" style="border:0;max-height:360px;overflow:auto"><table class="tbl resp"><thead><tr><th>Atividade</th><th>Responsável</th><th>Prazo</th><th>Conhecimento</th></tr></thead><tbody>${linhas.map(l => l.html).join('')}</tbody></table></div></div></section>`;
}
/* Na ficha da atividade */
function avisosAtivHtml(id) {
  const vs = (S.avisosVistos || []).filter(v => v.atividade_id === id); if (!vs.length) return '';
  return `<div class="nota" style="margin-bottom:10px"><b>Avisos vistos</b><ul style="margin:4px 0 0;padding-left:18px">${vs.map(v => `<li class="small">${TIPOS_AVISO[v.tipo]} (prazo ${fd(v.data_fim_ref)}) — visto por ${esc(v.email || '')} em ${new Date(v.visto_em).toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' })}</li>`).join('')}</ul></div>`;

Object.assign(ACOES, {
  'aviso-visto': async el => {

    catch (e) { toast(erroMsg(e), 'err'); }
  },

});

/* ===== PONTO DE SITUAÇÃO E RESPONSABILIDADES =====
   Cada tarefa/subtarefa tem um registo cronológico de «pontos de situação»: o que foi feito, próximo passo,
   dificuldades, pedido de apoio, execução (%) e estado. Pode registar quem é responsável pela atividade,
   pela tarefa-mãe ou pela área (pelo email), além do coordenador e editores. Gravado via RPC registar_ponto_situacao. */
const diasPonto = () => Number(S.cfg.ponto_situacao_dias) || 15;
function indexarPontos() {
  S.pontosDe = new Map();
  for (const p of (S.pontos || [])) { if (!S.pontosDe.has(p.atividade_id)) S.pontosDe.set(p.atividade_id, []); S.pontosDe.get(p.atividade_id).push(p); }
  S.pontosDe.forEach(v => v.sort((x, y) => (y.criado_em || '').localeCompare(x.criado_em || '')));
}
const pontosDe = id => (S.pontosDe && S.pontosDe.get(id)) || [];
/* Inclui os pontos das subtarefas quando se trata de uma tarefa */
const ultimoPonto = a => pontosDe(a.id)[0] || null;
const dataPonto = p => p ? pd(String(p.criado_em).slice(0, 10)) : null;
/* Atividade «ativa» (devia estar a ser executada) sem ponto de situação recente */
function semPontoRecente(a) {
  if (eFechada(a) || a.estado === 'suspensa') return false;
  const ini = pd(a.data_inicio_prevista); const comecou = a.estado === 'em_curso' || a.estado === 'bloqueada' || (ini != null && ini <= S.hoje);
  if (!comecou) return false;
  const u = ultimoPonto(a); const ref = u ? dataPonto(u) : (ini != null ? ini : null);
  return ref == null ? !u : S.hoje - ref > diasPonto();
}
const pedeApoio = a => { const u = ultimoPonto(a); return !!(u && u.precisa_apoio && !eFechada(a)); };
/* Responsáveis ligados ao utilizador (email) */
function meusRespIds() {
  const me = normEmail(S.perfil && S.perfil.email); if (!me) return new Set();
  return new Set(S.resp.filter(r => normEmail(r.email) === me).map(r => r.id));
}
function responsavelPor(a, ids) {
  ids = ids || meusRespIds(); if (!ids.size) return false;
  const t = a.parent_id ? S.byId.get(a.parent_id) : null; const ar = S.areaById.get(a.area_id);
  if (ids.has(a.responsavel_id) || (t && ids.has(t.responsavel_id))) return true;
  for (let x = ar; x; x = x._pai) if (ids.has(x.responsavel_id)) return true;
  return false;
}
const possoReportar = a => podeEditar() || responsavelPor(a);
const quando = iso => new Date(iso).toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' });
const haDias = p => { const d = S.hoje - dataPonto(p); return d <= 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`; };

/* ---------- HTML ---------- */
function htmlPonto(p, comAtiv) {
  const a = S.byId.get(p.atividade_id);
  return `<li class="ponto">
    <div class="ponto-cab"><b>${quando(p.criado_em)}</b> · ${esc(p.autor_email || '')}${p.reuniao_id && S.reuniaoById && S.reuniaoById.get(p.reuniao_id) ? ` · <a href="#" data-act="ir-reuniao" data-id="${p.reuniao_id}">📋 reunião</a>` : ''}${p.percentagem != null ? ` · <span class="pill">${p.percentagem}%</span>` : ''}${p.estado ? ` ${pill(p.estado === 'concluida' ? 'concluida' : p.estado === 'bloqueada' ? 'bloqueada' : 'em_curso', ESTADOS[p.estado])}` : ''}${p.precisa_apoio ? ' <span class="pill s-bad">Pede apoio</span>' : ''}</div>
    ${comAtiv && a ? `<div class="tt small" data-act="edit-ativ" data-id="${a.id}"><span class="code">${codigo(a)}</span> ${esc(a.designacao)}</div>` : ''}
    <div><span class="ponto-k">Feito:</span> ${esc(p.feito)}</div>
    ${p.proximo_passo ? `<div><span class="ponto-k">Próximo passo:</span> ${esc(p.proximo_passo)}</div>` : ''}
    ${p.dificuldades ? `<div class="ponto-dif"><span class="ponto-k">Dificuldades:</span> ${esc(p.dificuldades)}</div>` : ''}
  </li>`;
}
function pontosHtml(id) {
  const a = S.byId.get(id); const ps = pontosDe(id); const subs = S.filhosDe.get(id) || [];
  const psSubs = subs.flatMap(s => pontosDe(s.id)).sort((x, y) => y.criado_em.localeCompare(x.criado_em));
  const alerta = semPontoRecente(a) ? `<div class="nota aviso small">Sem ponto de situação ${ps.length ? 'há mais de ' + diasPonto() + ' dias' : 'registado'} — a atividade já devia estar em execução.</div>` : '';
  return `${alerta}${possoReportar(a) ? `<div class="row" style="margin-bottom:10px"><button class="btn primary sm" data-act="ponto-novo" data-id="${id}" data-volta="ativ">＋ Registar ponto de situação</button></div>` : ''}
    ${ps.length ? `<ul class="list pontos">${ps.map(p => htmlPonto(p)).join('')}</ul>` : '<div class="empty">Ainda não há pontos de situação registados.</div>'}
    ${psSubs.length ? `<h3 style="margin:12px 0 4px">Nas subtarefas</h3><ul class="list pontos">${psSubs.slice(0, 10).map(p => htmlPonto(p, true)).join('')}</ul>` : ''}`;
}
function registarPonto(id, volta) {
  const a = S.byId.get(id); if (!a) return;
  const filhos = S.filhosDe.get(id) || []; const u = ultimoPonto(a);
  const estados = ['em_curso', 'bloqueada', 'suspensa', 'concluida'];
  abrirModal({
    titulo: 'Ponto de situação',
    tamanho: 'sm',
    corpo: `<div class="small muted" style="margin-bottom:10px"><span class="code">${codigo(a)}</span> ${esc(a.designacao)}${a.data_fim_prevista ? ` · prazo ${fd(a.data_fim_prevista)}` : ''}</div>
    <form class="form" id="fPonto" onsubmit="return false">
      <label class="full">O que foi feito (obrigatório)<textarea name="feito" rows="3" placeholder="Ex.: Reunião com a Junta de Freguesia; minuta enviada para análise jurídica."></textarea></label>
      <label class="full">Próximo passo<input name="proximo" placeholder="Ex.: Aguardar parecer até 30/10"${u && u.proximo_passo ? '' : ''}></label>
      <label class="full">Dificuldades ou constrangimentos<input name="dificuldades" placeholder="Opcional"></label>
      <label>Execução (%)${filhos.length ? `<div class="calc">${fmtPct(pctAt(a), 1)} <span class="small muted">calculada pelas subtarefas</span></div>` : `<input type="number" name="percentagem" min="0" max="100" step="5" value="${Number(a.percentagem) || 0}">`}</label>
      <label>Estado<select name="estado">${estados.map(k => `<option value="${k}" ${(a.estado === k || (a.estado === 'nao_iniciada' && k === 'em_curso')) ? 'selected' : ''}>${ESTADOS[k]}</option>`).join('')}</select></label>
      <label class="full hidden" data-show="concl">Concluída em<input type="date" name="concluida_em" value="${ds(S.hoje)}"></label>
      <label class="chk full"><input type="checkbox" name="precisa_apoio"> Preciso de apoio ou de uma decisão do coordenador</label>
    </form>
    ${u ? `<div class="small muted" style="margin-top:8px">Último registo: ${quando(u.criado_em)} — ${esc(u.feito).slice(0, 140)}</div>` : ''}`,
    rodape: `<button class="btn" data-act="${volta === 'ativ' ? 'edit-ativ' : 'fechar-modal'}" data-id="${id}">Cancelar</button><button class="btn primary" data-act="ponto-gravar" data-id="${id}" data-volta="${volta || ''}">Gravar</button>`,
    onOpen: box => { const sel = box.querySelector('[name=estado]'); const t = () => box.querySelector('[data-show=concl]').classList.toggle('hidden', sel.value !== 'concluida'); sel.addEventListener('change', t); t(); }
  });
}
async function gravarPonto(el) {
  const id = Number(el.dataset.id); const a = S.byId.get(id); const v = lerForm($('#fPonto'));
  if (!(v.feito || '').trim()) return toast('Descreva o que foi feito.', 'err');
  let pct = v.percentagem == null ? null : Number(v.percentagem);
  if (pct != null && (isNaN(pct) || pct < 0 || pct > 100)) return toast('A execução tem de estar entre 0 e 100%.', 'err');
  if (v.estado === 'concluida') pct = (S.filhosDe.get(id) || []).length ? null : 100;
  const args = { p_atividade: id, p_feito: v.feito.trim(), p_proximo: v.proximo, p_dificuldades: v.dificuldades, p_precisa_apoio: !!v.precisa_apoio, p_percentagem: pct, p_estado: v.estado === a.estado ? null : v.estado, p_concluida_em: v.estado === 'concluida' ? v.concluida_em : null };
  el.disabled = true;
  const { error } = await sb.rpc('registar_ponto_situacao', args);
  if (error) { el.disabled = false; return toast(erroMsg(error), 'err'); }
  // O ponto de situação vale também como «Visto» do aviso desta atividade
  try { const av = meusAvisosPorVer().find(x => x.a.id === id); if (av) await registarVistos([av]); } catch (e) { }
  toast('Ponto de situação registado.');
  await carregarTudo(); render();
  const volta = el.dataset.volta;
  if (volta === 'ativ') { editarAtividade(id); const b = $('#modalRoot [data-tab=ponto]'); if (b) b.click(); }
  else if (volta === 'avisos') { const l = meusAvisosPorVer(); if (l.length) mostrarAvisos(l); else fecharModal(); }
  else fecharModal();
}

/* ---------- Painel ---------- */
function cartaoMinhas(max = 15) {
  const ids = meusRespIds(); if (!ids.size) return '';
  const minhas = ordenarAtiv(S.ativ.filter(a => !eFechada(a) && responsavelPor(a, ids)));
  const direto = a => ids.has(a.responsavel_id);
  const lin = a => { const u = ultimoPonto(a); const s = sit(a); return `<li><div class="grow"><div class="tt" data-act="edit-ativ" data-id="${a.id}"><span class="code">${codigo(a)}</span> ${esc(a.designacao)}</div>
      <div class="small muted">${direto(a) ? 'A meu cargo' : 'Na minha área · ' + esc(nomeResp(a.responsavel_id) || 'sem responsável')}${a.data_fim_prevista ? ' · prazo ' + fd(a.data_fim_prevista) : ''} · ${u ? 'último ponto ' + haDias(u) : '<span class="aviso-mau">sem ponto de situação</span>'}</div></div>
      ${pill(s, SITUACOES[s])}<button class="btn sm" data-act="ponto-novo" data-id="${a.id}">Ponto de situação</button></li>`; };
  const areasMinhas = S.areas.filter(ar => ids.has(ar.responsavel_id));
  return `<section class="card" style="margin-bottom:16px"><div class="hd"><h2>As minhas atividades</h2><span class="muted small">${minhas.length} em aberto${areasMinhas.length ? ` · responsável geral: ${areasMinhas.map(a => 'área ' + a.numero).join(', ')}` : ''}</span></div>
    <div class="bd">${minhas.length ? `<ul class="list minhas">${minhas.slice(0, max).map(lin).join('')}</ul>${minhas.length > max ? `<div class="small muted">… e mais ${minhas.length - max}.</div>` : ''}` : '<div class="empty">Não tem atividades em aberto.</div>'}</div></section>`;
}
function cartaoPontosRecentes() {
  if (!podeEditar()) return '';
  const ps = (S.pontos || []).slice().sort((x, y) => y.criado_em.localeCompare(x.criado_em)).slice(0, 6);
  return `<section class="card" style="margin-bottom:16px"><div class="hd"><h2>Últimos pontos de situação</h2></div><div class="bd">${ps.length ? `<ul class="list pontos">${ps.map(p => htmlPonto(p, true)).join('')}</ul>` : '<div class="empty">Ainda não foram registados pontos de situação. Os responsáveis registam-nos em cada tarefa ou subtarefa.</div>'}</div></section>`;
}

/* ---------- Ficha da área: equipa e acompanhamento ---------- */
function equipaArea(ar) {
  const todas = S.ativ.filter(a => a.area_id === ar.id && a.estado !== 'cancelada');
  const m = new Map();
  for (const a of todas) { const k = a.responsavel_id || 0; if (!m.has(k)) m.set(k, []); m.get(k).push(a); }
  return [...m.entries()].map(([id, l]) => ({ id, r: S.respById.get(id), l, ab: l.filter(a => !eFechada(a)).length, at: l.filter(a => eAtrasada(a, S.hoje)).length, sp: l.filter(semPontoRecente).length })).sort((x, y) => (x.id === 0) - (y.id === 0) || (x.r ? x.r.nome : '').localeCompare(y.r ? y.r.nome : ''));
}
function secaoAcompanhamento(ar) {
  const rg = S.respById.get(ar.responsavel_id); const eq = equipaArea(ar);
  const todas = ordenarAtiv(S.ativ.filter(a => a.area_id === ar.id && a.estado !== 'cancelada'));
  const nSem = todas.filter(semPontoRecente).length, nApoio = todas.filter(pedeApoio).length;
  return `<section class="card" style="margin-bottom:16px"><div class="hd"><h2>Equipa e ponto de situação</h2><span class="muted small">${nSem ? `<span class="aviso-mau">${nSem} sem ponto recente</span>` : 'tudo atualizado'}${nApoio ? ` · <b class="aviso-mau">${nApoio} ${nApoio === 1 ? "pede" : "pedem"} apoio</b>` : ''}</span></div><div class="bd">
    <div class="equipa"><div class="eq-geral"><span class="small muted">Responsável geral da área</span><b>${rg ? esc(rg.nome) : '<span class="muted">por atribuir</span>'}</b>${rg && (rg.unidade_organica || rg.email) ? `<span class="small muted">${esc([rg.unidade_organica, rg.email].filter(Boolean).join(' · '))}</span>` : ''}</div>
      ${eq.map(e => `<div class="eq-p"><b>${e.r ? esc(e.r.nome) : '<span class="muted">Sem responsável</span>'}</b><span class="small muted">${e.l.length} atividade(s) · ${e.ab} em aberto${e.at ? ` · <span class="aviso-mau">${e.at} atrasada(s)</span>` : ''}${e.sp ? ` · ${e.sp} sem ponto` : ''}</span></div>`).join('')}</div>

/* ----- Calendário: mês e cronograma ----- */
function itensAgenda(d0, d1) {
  const f = S._agF; const out = [];
  if (f.ver.r) for (const r of reunioesVisiveis()) { const d = pd(r.data); if (d != null && d >= d0 && d <= d1) out.push({ d, k: 'rn', r }); }
  let l = acoesAtivas(); if (f.resp) l = l.filter(p => String(p.responsavel_id) === f.resp);
  for (const p of l) {
    const i = pd(p.data_inicio), e = pd(p.data_fim); const fin = situacaoAcao(p) === 'finalizado';
    if (f.ver.p && i != null && i >= d0 && i <= d1) out.push({ d: i, k: 'ev', p });
    if (f.ver.f && e != null && e !== i && e >= d0 && e <= d1) out.push({ d: e, k: !fin && e < S.hoje ? 'atr' : 'evf', p });
  }
  const ordem = { rn: 0, atr: 1, evf: 2, ev: 3 };
  return out.sort((x, y) => x.d - y.d || ordem[x.k] - ordem[y.k]);
}

function vCronoAcoes() {

  const y0 = Math.round(Date.UTC(Y, 0, 1) / DIA_MS), y1 = Math.round(Date.UTC(Y + 1, 0, 1) / DIA_MS) - 1, N = y1 - y0 + 1;
  const X = d => ((Math.max(y0, Math.min(y1 + 1, d)) - y0) / N * 100).toFixed(3);

const MESES_C = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const _utc = (y, m, d) => Math.round(Date.UTC(y, m, d || 1) / DIA_MS);
function janelaGantt(g, anoFixo) {
  const hd = new Date(S.hoje * DIA_MS); let y = hd.getUTCFullYear(), m = hd.getUTCMonth();
  if (anoFixo != null || g.janela === 12) { const Y = anoFixo ?? (y + g.off); return { d0: _utc(Y, 0), d1: _utc(Y + 1, 0) - 1, meses: 12, titulo: String(Y) }; }
  const n = g.janela; m = m - (n >= 6 ? 1 : 0) + g.off * n;
  const d0 = _utc(y, m), d1 = _utc(y, m + n) - 1;
  const f = d => { const x = new Date(d * DIA_MS); return MESES_C[x.getUTCMonth()] + ' ' + x.getUTCFullYear(); };
  return { d0, d1, meses: n, titulo: `${f(d0)} – ${f(d1)}` };
}
function ganttAcoes(lista, { d0, d1, meses }, opc = {}) {
  const N = d1 - d0 + 1; const X = d => (Math.max(0, Math.min(N, d - d0)) / N * 100);
  const l = lista.filter(p => { const i = pd(p.data_inicio) ?? pd(p.data_fim), e = pd(p.data_fim) ?? i; return i != null && i <= d1 && e >= d0; });
  /* cabeçalho: meses (com o ano em janeiro e no primeiro mês) e linhas das semanas */
  const ms = []; { const a = new Date(d0 * DIA_MS); let y = a.getUTCFullYear(), m = a.getUTCMonth(); for (let k = 0; ; k++) { const s = _utc(y, m + k); if (s > d1) break; const e = Math.min(d1, _utc(y, m + k + 1) - 1); ms.push([s, e]); } }
  const nomeM = (s, k) => { const d = new Date(s * DIA_MS); const t = MESES_C[d.getUTCMonth()]; return (k === 0 || d.getUTCMonth() === 0) ? `${t} <small>${d.getUTCFullYear()}</small>` : t; };
  const cab = ms.map(([s, e], k) => `<div class="gt-m${s <= S.hoje && S.hoje <= e ? ' atual' : ''}" style="left:${X(s)}%;width:${X(e + 1) - X(s)}%"><span class="ml">${nomeM(s, k)}</span><span class="mc">${MESES_C[new Date(s * DIA_MS).getUTCMonth()]}</span></div>`).join('');

  if (false) for (let d = d0; d <= d1; d++) if (new Date(d * DIA_MS).getUTCDay() === 1 && new Date(d * DIA_MS).getUTCDate() !== 1) grelha += `<i class="gt-ls" style="left:${X(d)}%"></i>`;
  const temHoje = S.hoje >= d0 && S.hoje <= d1;
  const hoje = temHoje ? `<i class="gt-hoje" style="left:${X(S.hoje) + 50 / N}%"></i>` : '';
  /* lista simples, por data de início: nome à esquerda, barra à direita */
  let corpo = '';
  for (const p of l.sort((a, b) => (pd(a.data_inicio) ?? pd(a.data_fim)) - (pd(b.data_inicio) ?? pd(b.data_fim)))) {
    const i = pd(p.data_inicio) ?? pd(p.data_fim), e = pd(p.data_fim) ?? i; const s = situacaoAcao(p); const atr = atrasadaAcao(p);
    const cls = atr ? 'atr' : s; const a0 = X(i), a1 = X(e + 1); const ar = S.areaById.get(p.area_id);
    const tip = `${p.designacao} · ${periodoProj(p)} · ${atr ? 'Prazo ultrapassado' : SIT_ACAO[s] || ''}${ar ? ' · ' + caminhoArea(ar) : ''}${p.responsavel_id ? ' · ' + nomeResp(p.responsavel_id) : ''}`;
    corpo += `<div class="gt-r" data-act="ir" data-v="projeto" data-p="${p.id}" title="${esc(tip)}"><div class="gt-c"><span class="gt-n">${esc(p.designacao)}</span></div><div class="gt-t">${grelha}${hoje}<span class="gt-b ${cls}${i === e ? ' dia' : ''}" style="left:${a0}%;width:${a1 - a0}%"></span></div></div>`;
  }
  const legenda = `<div class="gt-leg"><span><i class="gt-lg nao_iniciado"></i>Não iniciado</span><span><i class="gt-lg em_tratamento"></i>Em tratamento</span><span><i class="gt-lg atr"></i>Atrasado</span><span><i class="gt-lg finalizado"></i>Finalizado</span></div>`;
  return `<div class="gt-wrap"><div class="gt" style="--meses:${meses}">

    ${corpo || `<div class="gt-vazio">${opc.vazio || 'Nenhuma ação com datas neste período.'}</div>`}
  </div></div>${legenda}`;
}

async function alternarUrgente(tabela, lista, id) {
  const x = lista.find(y => y.id === id); if (!x) return; const v = !x.urgente;
  try { await gravar(tabela, 'update', { urgente: v }, { id }); x.urgente = v; render(); toast(v ? 'Marcado como urgente.' : 'Deixou de ser urgente.'); }
  catch (e) { toast(/urgente/.test(erroMsg(e)) ? 'Falta correr dds_urgente.sql no Supabase.' : erroMsg(e), 'err'); }
}

/* ===== Utilizadores: criar conta e definir palavra-passe (coordenador) ===== */
function gerarPalavraPasse() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; const a = new Uint32Array(10); crypto.getRandomValues(a);
  return 'Dds-' + Array.from(a, x => c[x % c.length]).join('');
}
const htmlPass = (id, v) => `<div style="display:flex;gap:6px"><input id="${id}" value="${esc(v)}" autocomplete="new-password" style="flex:1;font-family:ui-monospace,Menlo,monospace"><button type="button" class="btn sm" onclick="document.getElementById('${id}').value=gerarPalavraPasse()" title="Gerar outra">↻</button></div>`;
async function mostrarCredenciais(email, pass) {
  const url = location.origin + location.pathname;

  await dialogo({ titulo: 'Dados para dar à pessoa', html: `<p class="small muted" style="margin-top:0">Copie e envie à pessoa. A palavra-passe não volta a ser mostrada (fica guardada encriptada).</p><textarea id="utCred" rows="6" readonly style="width:100%;font-family:ui-monospace,Menlo,monospace;font-size:14px;padding:10px;border:1px solid var(--linha);border-radius:9px">${esc(txt)}</textarea>`,
    botoes: [{ txt: 'Copiar', cls: '', manter: true, valor: w => { const t = w.querySelector('#utCred'); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } toast('Copiado.'); return undefined; } }, { txt: 'Fechar', cls: 'primary', valor: true }] });
}

    if (!v) return;
